name: Update tools

on:
  schedule:
    - cron: "17 1 * * *" # 08:17 Vietnam time, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - package*.json
      - .github/workflows/update-tools.yml

permissions:
  contents: write

concurrency:
  group: update-tools
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild images and the tools block
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "chore: refresh tools"
          git push
