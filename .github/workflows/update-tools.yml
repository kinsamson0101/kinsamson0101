name: Update tools list

on:
  schedule:
    - cron: "17 1 * * *" # 08:17 Vietnam time, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-tools.mjs
      - .github/workflows/update-tools.yml

permissions:
  contents: write

concurrency:
  group: update-tools
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild the tools block
        run: node scripts/update-tools.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh tools list"
          git push
